name: Taicor HyperDX Image

on:
  push:
    branches: [taicor/clickstack-2.32.0]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: taicor-hyperdx-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  ECR_REGISTRY: 701632806705.dkr.ecr.sa-east-1.amazonaws.com
  ECR_REPOSITORY: taicor/hyperdx

jobs:
  build-push:
    runs-on: [self-hosted, linux, x64, taicor-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve immutable source tag
        id: image
        shell: bash
        run: echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::701632806705:role/github-actions-hyperdx-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      - name: Build and push pinned production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/hyperdx/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          build-contexts: |
            hyperdx=./docker/hyperdx
            api=./packages/api
            app=./packages/app
          build-args: |
            CODE_VERSION=${{ github.sha }}
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=taicor-hyperdx-amd64
          cache-to: type=gha,mode=max,scope=taicor-hyperdx-amd64,ignore-error=true

      - name: Publish immutable deployment reference
        shell: bash
        run: |
          reference="${ECR_REGISTRY}/${ECR_REPOSITORY}@${{ steps.build.outputs.digest }}"
          echo "### HyperDX deployment image" >> "$GITHUB_STEP_SUMMARY"
          echo '\`'"$reference"'\`' >> "$GITHUB_STEP_SUMMARY"
