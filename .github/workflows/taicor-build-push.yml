name: Taicor HyperDX Image

on:
  pull_request:
    branches: [taicor/clickstack-2.32.0]
  push:
    branches: [taicor/clickstack-2.32.0]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: taicor-hyperdx-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  ECR_REGISTRY: 701632806705.dkr.ecr.sa-east-1.amazonaws.com
  ECR_REPOSITORY: taicor/hyperdx

jobs:
  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve immutable source tag
        id: image
        shell: bash
        run: echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        if: github.event_name != 'pull_request'
        with:
          role-to-assume: arn:aws:iam::701632806705:role/github-actions-hyperdx-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v3

      - name: Build and push pinned production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/hyperdx/Dockerfile
          target: prod
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}
          build-contexts: |
            hyperdx=./docker/hyperdx
            api=./packages/api
            app=./packages/app
          build-args: |
            CODE_VERSION=${{ github.sha }}
          tags:
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{
            steps.image.outputs.tag }}
          cache-from: type=gha,scope=taicor-hyperdx-amd64
          cache-to: type=gha,mode=max,scope=taicor-hyperdx-amd64,ignore-error=true

      - name: Load published image for verification
        if: github.event_name != 'pull_request'
        run:
          docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image.outputs.tag
          }}"

      - name: Smoke test production image
        run:
          scripts/ci/smoke-prod.sh "$ECR_REGISTRY/$ECR_REPOSITORY:${{
          steps.image.outputs.tag }}"

      - name: Scan production image
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          echo 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  '"$RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          image="$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image.outputs.tag }}"
          docker image inspect --format '{{.Id}}' "$image" > "$RUNNER_TEMP/image-id.txt"
          # The tested Zod backport remains visible to version-based scanners.
          "$RUNNER_TEMP/trivy" image --scanners vuln --format json --output "$RUNNER_TEMP/vulnerabilities.json" "$image"
          "$RUNNER_TEMP/trivy" image --scanners secret --exit-code 1 --format template --template '{{range .Results}}{{range .Secrets}}{{.RuleID}} {{.Severity}}{{"\n"}}{{end}}{{end}}' "$image" > "$RUNNER_TEMP/secret-summary.txt"

      - name: Upload image scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-image-security
          path: |
            ${{ runner.temp }}/image-id.txt
            ${{ runner.temp }}/vulnerabilities.json
            ${{ runner.temp }}/secret-summary.txt

      - name: Publish immutable deployment reference
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          reference="${ECR_REGISTRY}/${ECR_REPOSITORY}@${{ steps.build.outputs.digest }}"
          echo "### HyperDX deployment image" >> "$GITHUB_STEP_SUMMARY"
          echo '\`'"$reference"'\`' >> "$GITHUB_STEP_SUMMARY"
